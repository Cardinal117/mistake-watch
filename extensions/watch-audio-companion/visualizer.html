<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Mistake Watch Rhythm Lab</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e0e0f'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23feb700' stroke-width='3'/%3E%3Cpath d='M13 10l9 6-9 6z' fill='%2300dbe9'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="visualizer.css" />
  </head>
  <body>
    <main class="lab-shell">
      <canvas aria-label="Rhythm visualization" id="visualizer"></canvas>
      <header class="lab-header">
        <div>
          <p class="eyebrow">Mistake Watch / private companion</p>
          <h1 id="mode-title">Mirror Spectrum</h1>
        </div>
        <div class="signal-status" data-state="idle" id="status">
          Capture inactive
        </div>
      </header>

      <section class="rhythm-readout" aria-label="Detected rhythm">
        <div>
          <span>BPM</span>
          <strong id="bpm">--</strong>
        </div>
        <div>
          <span>Confidence</span>
          <strong id="confidence">0%</strong>
        </div>
      </section>

      <form class="control-bar">
        <label>
          <span>Visualizer</span>
          <select id="mode">
            <option value="spectrum">Mirror Spectrum</option>
            <option value="ribbon">Siri Ribbon</option>
            <option value="dot-waves">Dot Waves</option>
            <option value="signal-bloom">Signal Bloom</option>
            <option value="constellation">Constellation</option>
          </select>
        </label>
        <label>
          <span>Input</span>
          <select id="input">
            <option value="live">Companion rhythm</option>
            <option value="fixture">120 BPM fixture</option>
          </select>
        </label>
        <label>
          <span>Frame cap</span>
          <select id="fps">
            <option value="24">24 FPS</option>
            <option value="30">30 FPS</option>
          </select>
        </label>
        <button id="stop-capture" type="button">
          <span aria-hidden="true">■</span>
          Stop capture
        </button>
      </form>

      <p class="power-notice" id="power-notice">
        Beta / very high power. Static Artwork remains the safe default in
        Mistake Watch.
      </p>
    </main>
    <script type="module" src="visualizer.mjs"></script>
  </body>
</html>
