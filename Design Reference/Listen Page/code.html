<script>
        const container = document.getElementById('visualizer-container');
        const barCount = 40; // Reduced count for perfect centering balance
        const bars = [];

        // Initialize bars
        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement('div');
            bar.className = 'visualizer-bar w-1.5 rounded-full bg-secondary-fixed-dim/40';
            // Higher heights in the middle for a 'frequency' look
            const distanceCenter = Math.abs(i - barCount/2);
            const baseHeight = Math.max(10, 70 - (distanceCenter * 3));
            bar.style.height = baseHeight + '%';
            container.appendChild(bar);
            bars.push({ element: bar, baseHeight });
        }

        // Animation loop
        function animate() {
            bars.forEach((barObj, index) => {
                const noise = Math.random() * 30;
                // Simulating activity only on some bars for realism
                const isActive = (index > 10 && index < 30);
                const activeState = isActive ? 'bg-secondary-fixed-dim' : 'bg-outline-variant/40';
                barObj.element.className = `visualizer-bar w-1.5 rounded-full ${activeState}`;
                barObj.element.style.height = Math.min(100, barObj.baseHeight + (isActive ? noise : noise/4)) + '%';
            });
            requestAnimationFrame(animate);
        }
        
        // Start animation with a slight delay
        setTimeout(animate, 500);
    </script>
